; Defaults the Mod Configuration Menu shows for Dynamic Terrain Deformation. They match the plugin's
; own INI (Data\F4SE\Plugins\NMN_DeformableTerrain.ini). MCM saves what you change to
; Data\MCM\Settings\NMN_DeformableTerrain.ini; the plugin reads that file and never this one.

[General]
bEnableTessellation=1

[Footprints]
iSnowTracks=0
fStampDepth=6.0
bEnableWeather=1
fFootprintMetres=50.0
bIndoorPrints=1
fIndoorPrintOpacity=0.8

[Snow]
bEnableSnowRaise=1
fSnowRaiseHeight=35.0
bSnowCoverLowMeshes=1
fWinterHardGroundDepth=0.3
bSnowOnObjects=0
fSnowOnObjectsStrength=0.85
bSnowSparkle=1
fSnowSparkleRate=1000.0
fSnowSparkleLife=1.2

[World]
bEnableExplosionImpacts=1
bEnableProjectileImpacts=1
bEnableObjectStamps=1
bEnableBloodDecals=1
fBloodDecalSnowOpacity=0.75
bCorpseMarks=1
bCorpseBurial=1
fCorpseBurialSeconds=600.0
bHeatMeltsSnow=1
fHeatRadiusScale=2.5
bEnableScorch=1
bEnableThrusterBurn=0
bThrusterMeltsSnow=1
