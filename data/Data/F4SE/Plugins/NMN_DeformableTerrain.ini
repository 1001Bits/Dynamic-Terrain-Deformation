; Dynamic Terrain Deformation - Fallout 4
; ---------------------------------------------------------------------------------------
; Every value below is the built-in default. Delete a line (or the whole file) to fall back
; to it, and keep the game running while you tune: with EnableLiveReload the file is re-read
; within half a second of being saved, and a deleted line goes back to its default then too.
; Section headers are for reading only; keys may sit anywhere. Numbers use a dot for the
; decimal point (0.45, not 0,45); a value that is not a number keeps the default.
; Per-land-texture overrides live in Data\F4SE\Plugins\NMN_DeformableTerrain\<Name>\Surfaces.ini
; (see docs\Surfaces_Example.ini).
; With the Mod Configuration Menu (MCM) installed, the main options can be changed in game
; under Mod Config > Dynamic Terrain Deformation. What you choose there is saved to
; Data\MCM\Settings\NMN_DeformableTerrain.ini and wins over the same line here.

[Tessellation]
; Subdivide nearby landscape on the GPU so the marks have vertices to move.
EnableTessellation = 1
; Triangle winding of the generated patches (cw or ccw).
TessellationWinding = cw
; Upper limit on the tessellation factor per patch edge (1 to 64).
TessellationMaxFactor = 64.0
; Target distance between generated vertices where marks are, in world units.
TessellationTargetSpacing = 2.0
; Spacing across the raised snow blanket away from marks.
TessellationRaiseSpacing = 64.0
TessellationBlanketSpacing = 8.0
; Only subdivide the parts of a patch the deformation field can reach.
EnableTessellationBounds = 1
TessellationBoundDepth = 0.25
; Rebuild the G-buffer normal from the deformed surface.
RecomputeNormals = 1
NormalGradientEpsilon = 0.75
; Leave landscape outside the field (plus this margin) untouched.
CullDistantDraws = 1
CullMargin = 256.0
; Skip subdividing patches that are off screen (a GPU saving; turn off if the ground
; at the screen edges ever flickers).
EnablePatchCulling = 1
; Only route draws seen from the player's camera (not shadow maps or reflections).
RouteOnlyPlayerCamera = 1
; Compile the generated hull/domain shaders on a worker thread (no hitch on first use).
AsyncShaderCompilation = 1

[Field]
; The deformation field itself; can be switched on and off while the game runs.
UseClipmap = 1
; 1 = one 1536-unit field around the player, 2 = add a coarse 7680-unit ring.
ClipmapLevels = 2
ClipmapSeedSmoothing = 1.0

[Footprints]
StampRadiusScale = 1.0
; A foot more than this far above the actor's own feet never presses.
StampFootReach = 48.0
StampGroundClearance = 0.1
; Depth of an ordinary footprint, in world units, before the surface response.
StampDepth = 6.0
; Fraction of a mark that survives each second (0.99 = a half-life of about 69 seconds).
; The Response Decay column, a profile's Decay and the weather decay scales multiply how
; long a mark lasts relative to this (2 = twice as long, 0.5 = half as long). The longest
; half-life anything can reach is about two hours.
StampDecayPerSecond = 0.99
; How far from you, in metres, the ground shows marks and other people and creatures leave
; footprints (70 units make a metre). The field holds marks out to about 53 m (ClipmapLevels
; 2); less saves a little time in a crowd.
FootprintMetres = 50.0
; Fallout 4 feet are skeleton nodes: the first node down each branch whose name holds one
; of these words presses the ground (LLeg_Foot / RLeg_Foot on people, toes on creatures,
; LFootBiped on a protectron). A body with none stands on its ankles (a yao guai), else its
; wheels (a sentry bot, a robobrain's treads: each presses a groove as it rolls), else the
; last bone of each leg (a radroach).
StampFootNodes = foot,toe,paw,hoof
; Radius of a footprint for an actor the size of a person, in world units.
StampFootRadius = 6.0
; An actor's feet scale with its bound radius over this value, clamped to Min/Max.
StampFootSizeReference = 64.0
StampFootSizeMin = 0.5
StampFootSizeMax = 4.0
; A foot presses while it is at most this high above the land (scaled by size, a person's at
; the least, and half again for slopes; FRIK's visible feet three times it).
StampFootContactHeight = 12.0
; Only a planted foot presses, so walking leaves separate prints: one moving slower than this
; share of the actor's speed, or slower than StampFootPlantSpeed (units/second) when standing.
; 0 presses every low foot and smears it along the actor's path (continuous lines).
StampFootPlantFraction = 0.5
StampFootPlantSpeed = 30.0
; Snow: 0 leaves separate footprints there, as on any other ground. 1 lets legs wading
; through the raised snow plough continuous tracks instead.
SnowTracks = 0
; An actor none of whose real feet pressed over its last 96 units of travel (your own body in
; first person, which the game only now and then animates) gets synthetic steps instead, one
; print every StepLength + StepPerSpeed x speed units (about 45 walking, 60 jogging, 85
; running), alternately StepWidth left and right of its path, until a real foot presses again.
; On snow with SnowTracks = 1 it ploughs two tracks instead.
; In first person (the camera in your head) your steps are always made this way, the same
; prints as in third person, since the game does not animate your body's legs then. With a
; full-body first-person mod (Full Body First Person, True First Person, found by itself)
; your animated feet press instead. With FRIK in VR only your visible feet print, each where
; it comes down; no step is made up for you.
StampSyntheticStepLength = 25.0
StampSyntheticStepPerSpeed = 0.15
StampSyntheticStepWidth = 6.5
; Your own synthetic steps are not seen forming under you (in first person you have no feet
; to see): each print or stretch of trench waits until its ground is out of view, you are
; RevealDistance units away (about a stride and a half, so walking backwards shows them) or
; RevealSeconds of game time have passed (0 = no such limit).
StampSyntheticRevealDistance = 120.0
StampSyntheticRevealSeconds = 30.0
; An actor in power armour: footprint radius and depth multipliers.
PowerArmorFootScale = 1.3
PowerArmorDepthScale = 1.6
; Oriented, shoe-shaped prints for races with one of these keywords. A print points the way
; its foot does (ankle to toe bone) and is a left or right one by the bone's name (else by
; which side of the feet's middle it stands). StampFootSeparation: a foot nearer than this
; to that middle, sideways, presses a round mark instead (0: every foot prints).
StampFootShape = 1
StampShapeKeyword = ActorTypeHuman,ActorTypeGhoul,ActorTypeSuperMutant,ActorTypeSynth
StampFootLength = 1.3
StampFootAspect = 0.5
StampFootSeparation = 0.0
; Use the sole mask in Textures\NMN_DeformableTerrain\FootprintHeight.dds for the prints.
EnableStampShapes = 0

[Rims]
StampRimHeight = 0.2
StampRimIndependence = 1.0
StampRimSpan = 1.0
StampSlopeLimit = 50.0
StampReposeRate = 0.01
StampRimNoise = 0.0
StampRimLean = 1.0
StampChurn = 0.45
; The same five for snow; -1 = use the ordinary Stamp* value above.
SnowStampRimSpan = 0.7
SnowStampReposeRate = 0.1
SnowStampRimNoise = 0.8
SnowStampRimLean = 1.0
SnowStampChurn = 0.8

[Objects]
; Dropped weapons, armour, junk, food, chems and thrown grenades sink into soft ground.
EnableObjectStamps = 1
ObjectStampRadiusScale = 1.0
ObjectStampDepthScale = 1.0
ObjectFullSizeRadius = 1.0
ObjectContactTolerance = 48.0
ObjectSinkLimit = 40.0
; A resting object is pressed by its own footprint (its bounds as it lies, a long gun
; along its length) and lies on the undeformed ground. Its dent is at most
; ObjectStampMaxDepth deep (world units; snow is still cleared off it), so it does not
; hover over a hole, and its rim starts ObjectRimMargin outside the footprint, so the
; pushed-aside soil never rises over the object.
ObjectStampMaxDepth = 1.5
ObjectRimMargin = 3.0
; Seconds between scans of the loaded cells for candidates.
ObjectStampInterval = 0.2

[Heat]
; Fires, burning barrels, candles and road flares melt the snow around them. They are
; told by their model's file name (lowercase words, comma separated).
EnableHeatSources = 1
HeatKeywords = fxfire,fire01fx,fire02small,fire03small,mpsfire,barrel01fire,woodfire,waxcandle,flare01on,burningdebris,trashburnpile,brazier
HeatExcludeKeywords = off,doused,marker,extinguisher,escape,firescape,burnt,grating,clothesline,puddle
HeatRadius = 2.5
HeatRadiusScale = 2.5
HeatMaxRadius = 256.0
HeatMeltPerSecond = 0.85
; The melt is full out to HeatShoulder of its radius (0-0.95), then fades over a short edge;
; HeatMeltDepthScale is how much of the snow depth it melts (1 = down to the ground).
HeatShoulder = 0.7
HeatMeltsSnow = 1
HeatMeltDepthScale = 1.0
; Where a fire or a jet melts the snow down to the ground, the ground shows through; on a
; winter mod's white repaint it is tinted to its own colour (wet grass, soil, gravel).
MeltShowsGround = 1

[Scorch and jet thrusters]
; Burnt ground is darkened through the terrain's vertex colour, near the player. A full
; burn fades out over ScorchFadeSeconds and keeps 1 - ScorchDarkness of the ground's colour.
EnableScorch = 1
ScorchFadeSeconds = 600.0
ScorchDarkness = 0.85
; Robots that fly on a jet melt the snow under them (ThrusterMeltsSnow) and, with
; EnableThrusterBurn = 1, burn a black line along their path, while they hover within
; ThrusterReach units of the land (not over floors or roofs). ThrusterRaces are hex form
; ids: 000359F4 is HandyRace (Codsworth, Mr. Handy, Mr. Gutsy, Miss Nanny); a robot of any
; race fitted with thruster legs flies on its jet too. ThrusterScorch is how black the line
; is (0 to 1).
EnableThrusterBurn = 0
ThrusterRaces = 000359F4
ThrusterRadius = 14.0
ThrusterReach = 96.0
ThrusterScorch = 1.0
; Ground the jet does not blacken (snow is still melted wherever it lies).
ThrusterNoScorch = sand,mud
ThrusterMeltsSnow = 1

[Explosions and gunfire]
; Explosions blast a crater scaled by the explosion's radius.
EnableExplosionImpacts = 1
ExplosionImpactRadiusScale = 0.5
ExplosionImpactMaxRadius = 256.0
ExplosionImpactDepth = 18.0
; Bullets, lasers and other projectiles that strike the landscape leave a small dent.
EnableProjectileImpacts = 1
ProjectileImpactRadius = 5.0
ProjectileImpactDepth = 2.5
ImpactRimScale = 0.1
ImpactSnowMelt = 0.3

[Blood and ground decals]
; Blood, scorch marks and bullet holes lie on the deformed ground: in a crater, a footprint
; or a trench, and on top of the snow blanket instead of hidden inside it. Each one on the
; landscape is fitted from BloodDecalDepthMargin below the ground to the margin above the
; snow's top; its centre must be within BloodDecalGroundTolerance of the land height.
; MaxBloodDecalsPerFrame caps the work a frame. Flat screen only (VR keeps the game's decals).
EnableBloodDecals = 1
BloodDecalDepthMargin = 20.0
BloodDecalGroundTolerance = 24.0
; How strongly blood and other decals show where they lie on snow, 0 to 1: blood soaks into
; snow, so the snow shows through it (1 = as on bare ground).
BloodDecalSnowOpacity = 0.75
MaxBloodDecalsPerFrame = 256

[Corpses]
; A body that has come to rest lies in a hollow of its own shape in the snow (it lies on the
; ground, under the blanket's top) and on a shallow print in other soft ground. While snow
; falls (a snow weather, or rain under WinterMode) the hollow fills back in over the first
; half of CorpseBurialSeconds (real seconds of full snowfall) and a mound CorpseMoundHeight
; units high grows over the body in the second. Without snowfall a hollow stays as it is.
; The MaxCorpseMarks nearest bodies are marked, only with the field's room left over after
; feet, impacts and objects.
CorpseMarks = 1
CorpseBurial = 1
CorpseBurialSeconds = 600.0
CorpseMoundHeight = 6.0
MaxCorpseMarks = 12

[Weather]
; Rain and snow soften the ground: marks up to WeatherSoftDepthScale deeper that recover
; sooner. Falling rain or snow fills the marks as fast as it softens the ground:
; WeatherFillPerSecond times its Soften value (snowfall: half filled in about 3 minutes; rain,
; softening 8 times as fast, in about 25 seconds). The Firm scales apply in clear weather; at 1 dry ground keeps
; its usual marks. The decay scales multiply how long a mark lasts, like the Response Decay
; column.
EnableWeather = 1
WeatherFillPerSecond = 0.0038
WeatherSoftenHours = 1.0
WeatherFirmHours = 1.0
WeatherSnowSoften = 1.0
WeatherRainSoften = 8.0
WeatherCloudyFirmScale = 0.25
WeatherSoftDepthScale = 1.5
WeatherFirmDepthScale = 1.0
WeatherSoftDecayScale = 0.5
WeatherFirmDecayScale = 1.0

[Snow blanket]
; Lift snow-textured landscape into a deep layer that trenches when walked through.
EnableSnowRaise = 1
SnowRaiseHeight = 35.0
SnowRaiseWeather = 0
SnowRaiseDistance = 7936.0
SnowRaiseFadeBand = 4000.0
SnowCoverageBudget = 2048
SnowTrenchDepth = 0.5
SnowTrenchCoverage = 0.95
SnowGroundFloor = 1
SnowGroundBite = 0.0
SnowSeamTexels = 1
; No blanket on land below its cell's water surface, so rivers and lakes are not filled
; with snow banks standing in the water. Placed water objects are not detected.
SnowSkipUnderwater = 1
; Keep the blanket out from under roofs and overhangs (upward ray casts).
EnableShelter = 1
; Upward ray casts per frame for the shelter map.
ShelterBudget = 48
; Shelter texels re-checked per 1/60 s (so x60 per second at any frame rate), paid from
; what ShelterBudget leaves after newly visible and retried texels. 4 re-reads the whole map
; about once a minute (a roof built or removed is noticed by then) for some 0.04 ms a frame;
; nothing is probed while no ground in reach is snow.
ShelterRefresh = 4
; Milliseconds of game-thread CPU per frame the shelter rays may use; where rays are
; expensive the re-checks slow down instead of costing frame time.
ShelterTimeBudget = 0.5
ShelterClearance = 48.0
ShelterHeight = 1024.0
ShelterSeamTexels = 1
; Keep the blanket below static meshes on the ground (paths, roads, floors), with the
; smallest height above the land a mesh must reach to count.
ShelterMeshCap = 1
ShelterFloorTolerance = 1.0
; Bury low static meshes instead: where a mesh's top lies no higher than SnowCoverMeshHeight
; above the land (roads, paths, sidewalks, slabs, low rubble; never more than
; SnowRaiseHeight - 2) the blanket rises over it as over the land, and feet, steps, shots and
; blasts on it press the snow. Higher meshes (big rocks, porches, foundations, bridges) keep
; the blanket under their top. 0 keeps every mesh above the snow, as before.
SnowCoverLowMeshes = 1
SnowCoverMeshHeight = 31.0
; Snow on the tops of objects that stand above it (roofs, rock tops, car roofs, porches)
; wherever the ground around them is snow: rays straight down find each square's topmost
; static surface around the player, and after the game's G-buffer pass the upward faces at that
; height are whitened. Walls, actors, things under a roof and the land itself stay as they are.
; Flat screens only. Strength 0-1 is how white; faces whose normal points up less than MinUp
; (0-0.99) stay bare, with a soft edge over the next 0.3; Distance (256-2000 units) is how far
; around the player the tops are probed. Off by default: it costs about 0.3 ms a frame
; wherever there is snow. Steps on whitened stairs and porches keep snowy boots loaded.
SnowOnObjects = 0
SnowOnObjectsStrength = 0.85
SnowOnObjectsMinUp = 0.5
SnowOnObjectsDistance = 1500.0
; 1 shows what the pass decided instead of whitening, to find why a surface stays bare: green
; snow, red over the snow but on no probed top (its collision far from what is drawn), yellow
; over the snow with no top on any of the four squares around, blue at or under the snow
; surface (the ground, the blanket, a buried mesh), which the pass never whitens.
SnowOnObjectsDebug = 0

[Indoor prints]
; Shoe prints on floors. Walking through mud, snow or dust outside loads the boots (mud
; strongly, snow as grey slush, dirt, sand and ash as dust, grass and gravel faintly); on a floor
; that is not landscape - inside a house or a vault, on a porch, on a road the snow leaves
; bare - each step then leaves a print coloured onto the floor, fainter with every step,
; until the boots are clean. Clean ground outside (stone) wipes them. Flat screens only.
IndoorPrints = 1
; Prints a fully loaded pair of boots leaves before it is clean.
IndoorPrintSteps = 14
; How long a dusty print lasts, in seconds of play (the clock stops in menus); it stays
; full for the first half, then fades. Slush melts away in 0.4 of it, mud lasts 1.5 times
; as long.
IndoorPrintFadeSeconds = 600.0
; How strongly a fresh print shows, 0 to 1.
IndoorPrintOpacity = 0.8
; Prints kept (the oldest give way), and how far from the player they are drawn.
MaxIndoorPrints = 512
IndoorPrintDistance = 2048.0

[Snow spray]
; Flakes kicked up by feet moving through snow (flat screen only; can be switched on and
; off while the game runs).
SnowSparkle = 1
SnowSparkleRate = 1000.0
SnowSparkleFullSpeed = 350.0
SnowSparkleMinSpeed = 40.0
SnowSparkleSize = 1.6
SnowSparkleLife = 1.2
SnowSparkleThrow = 500.0
SnowSparkleRise = 80.0
SnowSparkleInherit = 1.0
SnowSparkleGravity = 300.0
SnowSparkleDrag = 4.2
SnowSparkleSwirl = 100.0
SnowSparkleBrightness = 0.75
SnowSparkleOpacity = 0.8
SnowSparkleShape = 1.0

[Surfaces]
; A landscape texture's surface comes from its land texture's material type (Snow, Grass,
; Dirt, Mud, Sand, Gravel, Stone...). These texture-name words decide the rest.
EnableSurfaceClassification = 1
; Fallout 4 has no snow landscape. Winter mods that add their own snow land textures are
; found by name or material; mods that repaint the vanilla ground white in place (Winter
; Overhaul, Seasons Change in winter and the like) keep the old names. -1 looks at each
; ground texture instead: one that is mostly bright, colourless white is snow, and where
; most of the ground is, rain falls as snow. To force it: 0 = by name and material only,
; 1 = all ground except stone and roads is snow, 2 = all ground is snow. Land under water
; never gets the snow blanket either way.
WinterMode = -1
; Stone and gravel turned to snow hold only a thin layer of it: marks there
; go this share as deep as on other snow (1 = as deep), so the rocks are not dug up. Marks
; never dig below a low mesh the snow buries (a rock, a slab) either way.
WinterHardGroundDepth = 0.3
SurfaceSnow   = snow,ice,frost,frozen,winter
SurfaceGrass  = grass,lawn,scrub,weeds,moss,shrub,meadow
SurfaceDirt   = dirt,path,forestfloor,leaves,needles,roots,blastedforest,foothills,hilldirt,valleydirt,soil,commonwealthdefault
SurfaceMud    = mud,muck,silt,marsh,swamp,bog,nest,corrosion
SurfaceSand   = sand,oceanfloor,beach,dune
SurfaceAsh    = ^ash,_ash,seaash,ashes,volcanic,burnt,scorch,cinder
SurfaceGravel = gravel,rubble,debris,riverbedrocks,rockyshore,oyster,trash,pebble
SurfaceStone  = asphalt,concrete,cobble,rock,cliff,marble,brick,pavement,road,tile,metal,quarry

; depth, radius, shoulder, decay, rim, print (0/1), clearance
; decay multiplies how long a mark lasts relative to StampDecayPerSecond (0.05 to 20):
; snow keeps a print four times as long, sand loses it in a few seconds.
ResponseSnow    = 1.20, 1.00, 0.40, 4.00, 1.25, 1, 4.0
ResponseMud     = 1.10, 1.05, 0.35, 3.00, 0.70, 1, 1.0
ResponseAsh     = 1.00, 1.10, 0.20, 1.00, 1.00, 1, 1.0
ResponseSand    = 0.90, 1.15, 0.15, 0.10, 1.10, 1, 1.0
ResponseDirt    = 0.75, 1.00, 0.45, 2.00, 0.45, 1, 1.0
ResponseGrass   = 0.45, 1.00, 0.25, 0.33, 0.30, 0, 1.0
ResponseGravel  = 0.35, 1.00, 0.20, 0.25, 0.50, 0, 1.0
ResponseStone   = 0.00, 1.00, 0.30, 1.00, 0.00, 0, 1.0
ResponseUnknown = 0.60, 1.00, 0.35, 1.00, 0.60, 1, 1.0

; Darken and blend the landscape layers inside the marks.
EnableSurfaceMaterial = 1
BlendStrength = 0.45
SnowRevealStrength = 0.4
BlendFullDepth = 4.0

[Debug]
; Tint the ground where the field moved it: red down, green up. 1 = tint by depth,
; 2 = full tint, 3 = paint it through the first landscape layer instead.
DebugFieldColour = 0
; Show one landscape blend layer only (0-3), -1 = off.
DebugBlendLayer = -1
DebugWorldZOffset = 0.0
DebugWaveAmplitude = 0.0
DebugWaveLength = 256.0

[Logging]
; Every info line. Each Log* switch below, and EnableProfiler, print their own lines
; without it.
EnableLogging = 0
LogGeneratedShaders = 0
LogDraws = 0
LogStampShape = 0
LogStampSurfaces = 0
LogStampFeet = 0
; Every foot of every moving actor, every frame, into NMN_DeformableTerrain_feet.csv beside
; the log (at most 500000 rows), for studying footfalls.
TraceFeet = 0
LogObjectStamps = 0
LogHeatSources = 0
LogThrusters = 0
LogImpacts = 0
LogBloodDecals = 0
LogCorpses = 0
LogWeather = 0
LogSnowCoverage = 0
LogSurfaceClassification = 0
EnableProfiler = 0
ProfileInterval = 5.0
ProfileDrawScopes = 0
EnableLiveReload = 1
LiveReloadInterval = 0.5
